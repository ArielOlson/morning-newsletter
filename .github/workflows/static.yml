name: Deploy morning newsletter
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the prepared edition
        run: |
          test -f dist/index.html
          test -f dist/data/brief.enc.json
          node -e 'const b=require("./dist/data/brief.enc.json"); if(b.version!==1 || b.cipher!=="AES-256-GCM" || !b.ciphertext) process.exit(1); if(require("fs").existsSync("dist/data/brief.json")) process.exit(1); console.log("Deploying encrypted edition");'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
