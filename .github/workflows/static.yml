name: Deploy morning newsletter
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the prepared edition
        run: |
          test -f dist/index.html
          test -f dist/data/brief.enc.json
          node -e 'const b=require("./dist/data/brief.enc.json"); if(b.version!==1 || b.cipher!=="AES-256-GCM" || !b.ciphertext) process.exit(1); if(require("fs").existsSync("dist/data/brief.json")) process.exit(1); console.log("Deploying encrypted edition");'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: ${{ env.PAGES_ARTIFACT }}
      - name: Wait for uploaded artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in {1..12}; do
            if artifact_count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate | jq -s --arg name "$PAGES_ARTIFACT" '[.[].artifacts[] | select(.name == $name and .expired == false)] | length'); then
              if [ "$artifact_count" -eq 1 ]; then
                echo "Prepared site artifact is available."
                exit 0
              fi
              if [ "$artifact_count" -gt 1 ]; then
                echo "Unexpected duplicate artifact for this deployment attempt."
                exit 1
              fi
            fi
            sleep 5
          done
          echo "Pages artifact did not become available within the bounded wait."
          exit 1
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
